<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ed">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e5ecda'/%3E%3Cg fill='%2375996e'%3E%3Cellipse cx='9' cy='11' rx='3' ry='4'/%3E%3Cellipse cx='16' cy='7' rx='3' ry='4'/%3E%3Cellipse cx='23' cy='11' rx='3' ry='4'/%3E%3Cellipse cx='16' cy='21' rx='9' ry='7'/%3E%3C/g%3E%3C/svg%3E">
  <title>喵喵消消屋 · 20 关体验版</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <main class="studio">
    <section class="intro" aria-label="游戏介绍">
      <a class="brand" href="/" aria-label="喵喵消消屋首页">
        <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><ellipse cx="7" cy="12" rx="3" ry="4" transform="rotate(-25 7 12)"/><ellipse cx="13" cy="6" rx="3" ry="4"/><ellipse cx="21" cy="6" rx="3" ry="4"/><ellipse cx="27" cy="12" rx="3" ry="4" transform="rotate(25 27 12)"/><path d="M7 24C5 19 12 13 17 13S29 19 27 24C25 29 21 24 17 26S9 29 7 24Z"/></g></svg>
        <span>喵喵消消屋</span>
      </a>
      <p class="eyebrow"><span></span> 给自己一小段放松时间</p>
      <h1>把今天的烦恼，<br>消成<span>小小的快乐。</span></h1>
      <p class="description">阳光、小猫，还有一屋子的可爱小物。<br>每过一关，给小猫添一件暖暖的小心意。</p>
      <div class="chapter"><span class="chapter-number" id="chapter-number">01</span><div><strong id="chapter-title">暖暖客厅</strong><span id="chapter-subtitle">逐步挑战 · 随时回来接着玩</span></div><span class="chapter-label">20关体验版</span></div>
      <ol class="steps">
        <li><span>1</span><p>取走<strong>没有被盖住</strong>的图块</p></li>
        <li><span>2</span><p>暂存小窝里，<strong>三张相同</strong>自动消除</p></li>
        <li><span>3</span><p>记得留出空位，<strong>清空棋盘</strong>就过关</p></li>
      </ol>
      <div class="cat-note"><canvas id="mascot" width="280" height="150" aria-hidden="true"></canvas><p>“不用着急，我陪你呀。”</p></div>
      <p class="footnote">一只小猫，一点耐心，一场刚刚好的小挑战。</p>
    </section>
    <section class="play-area" aria-label="四章二十关游戏">
      <div class="phone">
        <canvas id="game" aria-label="猫咪叠层三消棋盘"></canvas>
        <div id="interaction-layer" aria-label="游戏操作"></div>
      </div>
      <p class="preview-label"><span></span> 通关收集小物 · 把小屋布置得暖暖的</p>
    </section>
  </main>
  <div id="live-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <audio id="background-music" src="/assets/audio/bgm.wav" preload="auto" loop></audio>
  <script src="/utils/game.js"></script>
  <script src="/utils/art.js"></script>
  <script src="/utils/progress.js"></script>
  <script src="/utils/audio.js"></script>
  <script src="/utils/view.js"></script>
  <script src="/web/main.js"></script>
</body>
</html>
